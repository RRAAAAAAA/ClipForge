<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<style>
:root{--bg:#15233b;--panel:#1d3052;--ink:#eef2f8;--mute:#9db0cf;--hot:#ff5470;--ok:#4fd1a5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
h1{font:700 2.4rem/1.1 Georgia,serif;margin:0 0 6px}
p.sub{color:var(--mute);margin:0 0 22px}
.bar{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:var(--ink);background:#0f1b30;border:1px solid #38507c;border-radius:8px;padding:10px 12px}
.bar input{flex:1;min-width:220px}
button{background:var(--hot);border-color:var(--hot);font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.alt{background:transparent;border-color:#38507c}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#status{margin:16px 0;color:var(--mute);min-height:1.5em}
#status.err{color:#ff9aa9}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.clip{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vid{aspect-ratio:9/16;background:#0a1220;border-radius:10px;display:grid;place-items:center;color:var(--mute);overflow:hidden}
.vid video{width:100%;height:100%;object-fit:cover}
.score{font-weight:700;color:var(--ok)}
.clip input,.clip textarea,.clip select{width:100%}
textarea{min-height:90px;resize:vertical}
.clip input[type=checkbox]{width:auto;margin-right:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
a.dl{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--ok);color:#06231a;font-weight:700;border-radius:8px;padding:10px}
.why{color:var(--mute);font-size:.9rem;margin:0}
</style>
</head>
<body>
<main>
  <h1>ClipForge</h1>
  <p class="sub">Paste a YouTube link. Get vertical clips with captions, titles and scores you can edit.</p>
  <div class="bar">
    <input id="url" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link">
    <select id="count" aria-label="Number of clips"><option value="1">1 clip</option><option value="2">2 clips</option><option value="3" selected>3 clips</option><option value="4">4 clips</option><option value="5">5 clips</option></select>
    <button id="go">Generate clips</button>
  </div>
  <div id="status" role="status"></div>
  <div id="grid"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const FONTS = ['Liberation Sans', 'DejaVu Sans', 'Liberation Serif', 'DejaVu Sans Mono'];
let MUSIC = [];
fetch('/api/music').then((r) => r.json()).then((j) => (MUSIC = j)).catch(() => {});
const status = (t, err) => { const s = $('#status'); s.textContent = t; s.className = err ? 'err' : ''; };
const post = async (u, b) => {
  const r = await fetch(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// start a background job on the server, then check on it every 2 seconds until it finishes
const job = async (u, b, tick) => {
  const { job: id } = await post(u, b);
  const t0 = Date.now();
  for (let fails = 0; ;) {
    await sleep(2000);
    let r;
    try { r = await (await fetch('/api/job/' + id)).json(); } catch { if (++fails > 15) throw new Error('Lost connection to the server.'); continue; }
    fails = 0;
    if (r.status === 'done') return r;
    if (r.status === 'error') throw new Error(r.error);
    if (tick) tick(Math.round((Date.now() - t0) / 1000));
  }
};

async function render(card, id, c) {
  const btn = card.querySelector('.rb'), box = card.querySelector('.vid');
  btn.disabled = true; btn.textContent = 'Rendering…'; box.textContent = 'Rendering…';
  try {
    const j = await job('/api/render', { id, start: c.start, end: c.end,
      font: card.querySelector('.font').value, text: card.querySelector('.cap').value, edited: card.dataset.edited === '1',
      music: card.querySelector('.music').value, volume: card.querySelector('.vol').value / 100, frame: card.querySelector('.frame').value, broll: card.querySelector('.broll').checked },
      (s) => (box.textContent = `Rendering… ${s}s`));
    box.innerHTML = `<video src="${j.url}" controls playsinline></video>`;
    card.querySelector('.note').textContent = j.note || '';
    if (j.text) { card.querySelector('.cap').value = j.text; card.dataset.edited = ''; } // show the exact words that were captioned
    let dl = card.querySelector('.dl');
    if (!dl) { dl = document.createElement('a'); dl.className = 'dl'; dl.textContent = 'Download clip'; card.append(dl); }
    dl.href = j.url; dl.download = c.title.replace(/[^\w ]/g, '') + '.mp4';
  } catch (e) { box.textContent = 'Render failed: ' + e.message; }
  btn.disabled = false; btn.textContent = 'Apply edits';
}

function addCard(id, c) {
  const card = document.createElement('article');
  card.className = 'clip';
  card.innerHTML = `
    <div class="vid">Waiting…</div>
    <p class="why note"></p>
    <div class="row"><span class="score">Virality ${c.score}/100</span><span>${Math.round(c.end - c.start)}s</span></div>
    <p class="why"></p>
    <input class="title" aria-label="Title">
    <textarea class="desc" aria-label="Description"></textarea>
    <label>Caption text<textarea class="cap"></textarea></label>
    <label>Background music<select class="music"></select></label>
    <label>Framing<select class="frame"><option value="auto">Follow speakers (auto)</option><option value="center">Centre crop</option></select></label>
    <label>Music volume<input class="vol" type="range" min="0" max="200" value="70"></label>
    <label><input class="broll" type="checkbox" checked>Add B-roll (full-screen stock footage)</label>
    <div class="row"><select class="font" aria-label="Caption font">${FONTS.map((f) => `<option>${f}</option>`).join('')}</select>
    <button class="rb alt">Apply edits</button></div>`;
  card.querySelector('.why').textContent = c.reason;
  card.querySelector('.title').value = c.title;
  card.querySelector('.desc').value = c.description;
  card.querySelector('.cap').value = c.text;
  const ms = card.querySelector('.music');
  ms.innerHTML = `<option value="">${MUSIC.length ? 'No music' : 'No music files found on server'}</option>` + MUSIC.map((f) => `<option value="${f}">${f.replace(/\.\w+$/, '').replace(/-/g, ' ')}</option>`).join('');
  ms.value = MUSIC.find((f) => c.mood && f.startsWith(c.mood)) || MUSIC[0] || '';
  card.querySelector('.cap').oninput = () => (card.dataset.edited = '1');
  card.querySelector('.title').oninput = (e) => (c.title = e.target.value);
  card.querySelector('.rb').onclick = () => render(card, id, c);
  $('#grid').append(card);
  return card;
}

$('#go').onclick = async () => {
  const url = $('#url').value.trim();
  if (!url) return status('Paste a YouTube link first.', true);
  $('#go').disabled = true; $('#grid').innerHTML = '';
  status('Downloading video and transcript, then picking clips. This can take a few minutes…');
  try {
    const { id, clips } = await job('/api/analyze', { url, count: +$('#count').value },
      (s) => status(`Downloading, reading the transcript and picking clips… ${s}s`));
    status(`Found ${clips.length} clips. Rendering previews…`);
    const cards = clips.map((c) => addCard(id, c));
    for (let i = 0; i < clips.length; i++) await render(cards[i], id, clips[i]);
    status('Done. Edit captions, font or title, then click Apply edits to re-render.');
  } catch (e) { status(e.message, true); }
  $('#go').disabled = false;
};
</script>
</body>
</html>
